<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çıkış Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md mx-auto overflow-hidden bg-white rounded-lg shadow-lg dark:bg-gray-800">
        <div class="px-6 py-8 md:px-8">
            <!-- Logo -->
            <div class="flex justify-center mx-auto">
                <img class="w-auto h-10" src="https://sanel.com.tr/wp-content/uploads/2020/09/Favicon-64px.jpg" alt="">
            </div>

            <!-- Başlık -->
            <h2 class="mt-4 text-2xl font-bold text-center text-gray-800 dark:text-gray-200">
                Misafir Ağından Ayrıl
            </h2>

            <!-- Açıklama Metni -->
            <p class="mt-2 text-sm text-center text-gray-600 dark:text-gray-400">
                Oturumunuzu güvenli bir şekilde sonlandırmak için aşağıdaki butona tıklayın.
            </p>

            <!-- Çıkış Yap Butonu -->
            <div class="mt-6">
                <button class="w-full px-6 py-3 text-sm font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-red-600 rounded-lg hover:bg-red-500 focus:outline-none focus:ring focus:ring-red-300 focus:ring-opacity-50">
                    <i class="fas fa-sign-out-alt mr-2"></i>Çıkış Yap
                </button>
            </div>

            <!-- İptal Butonu -->
            <div class="mt-4">
                <a href="#" class="w-full px-6 py-3 text-sm font-medium tracking-wide text-gray-700 capitalize transition-colors duration-300 transform bg-gray-200 rounded-lg hover:bg-gray-300 focus:outline-none focus:ring focus:ring-gray-300 focus:ring-opacity-50 flex items-center justify-center">
                    <i class="fas fa-times mr-2"></i>İptal
                </a>
            </div>
        </div>
    </div>

</body>
</html>
